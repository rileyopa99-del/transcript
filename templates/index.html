<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sales-Ops Transcript Analyzer</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --border: #d8dce1;
    --bg: #f7f8fa;
    --accent: #2454ff;
    --text: #1c2333;
    --muted: #667085;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
    background: white;
  }
  header h1 {
    margin: 0 0 4px 0;
    font-size: 20px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
  }
  main {
    max-width: 1100px;
    margin: 24px auto;
    padding: 0 24px 48px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 900px) {
    main { grid-template-columns: 1fr; }
  }
  .panel {
    background: white;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    font-size: 15px;
    margin: 0 0 12px 0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  textarea {
    width: 100%;
    min-height: 420px;
    resize: vertical;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 13px;
    line-height: 1.5;
  }
  .toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    flex-wrap: wrap;
  }
  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 14px;
    font-weight: 600;
  }
  #analyzeBtn {
    background: var(--accent);
    color: white;
  }
  #analyzeBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }
  #copyBtn, .file-label {
    background: #eef0f3;
    color: var(--text);
  }
  .file-label {
    display: inline-block;
    cursor: pointer;
  }
  input[type="file"] { display: none; }
  #status {
    font-size: 13px;
    color: var(--muted);
  }
  #error {
    display: none;
    margin-top: 12px;
    padding: 10px 12px;
    border-radius: 8px;
    background: #fdecec;
    color: #b3261e;
    font-size: 13px;
  }
  #reportOutput {
    flex: 1;
    overflow-y: auto;
    font-size: 14px;
    line-height: 1.55;
  }
  #reportOutput.placeholder {
    color: var(--muted);
    font-size: 14px;
  }
  #reportOutput h1, #reportOutput h2, #reportOutput h3 {
    margin-top: 20px;
    margin-bottom: 8px;
  }
  #reportOutput p { margin: 6px 0; }
  #reportOutput ul { margin: 6px 0; padding-left: 22px; }
  .spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255,255,255,0.5);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>Sales-Ops Transcript Analyzer</h1>
  <p>Paste a raw sales call transcript and get a structured report: account summary, blockers, action items, CRM notes, and a draft customer email. (Model: {{ model }})</p>
</header>

<main>
  <section class="panel">
    <h2>1. Paste transcript</h2>
    <textarea id="transcriptInput" placeholder="Paste the raw Teams/Zoom transcript here..."></textarea>
    <div class="toolbar">
      <button id="analyzeBtn">Analyze Transcript</button>
      <label class="file-label" for="fileInput">Upload .txt file</label>
      <input type="file" id="fileInput" accept=".txt,.md">
      <span id="status"></span>
    </div>
    <div id="error"></div>
  </section>

  <section class="panel">
    <h2>2. Structured report</h2>
    <div id="reportOutput" class="placeholder">Your report will appear here after analysis.</div>
    <div class="toolbar">
      <button id="copyBtn" style="display:none;">Copy report as text</button>
    </div>
  </section>
</main>

<script>
const analyzeBtn = document.getElementById('analyzeBtn');
const copyBtn = document.getElementById('copyBtn');
const transcriptInput = document.getElementById('transcriptInput');
const fileInput = document.getElementById('fileInput');
const reportOutput = document.getElementById('reportOutput');
const errorBox = document.getElementById('error');
const statusEl = document.getElementById('status');

let lastReportText = '';

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => { transcriptInput.value = e.target.result; };
  reader.readAsText(file);
});

function showError(message) {
  errorBox.textContent = message;
  errorBox.style.display = 'block';
}

function clearError() {
  errorBox.style.display = 'none';
  errorBox.textContent = '';
}

analyzeBtn.addEventListener('click', async () => {
  const transcript = transcriptInput.value.trim();
  clearError();

  if (!transcript) {
    showError('Please paste or upload a transcript first.');
    return;
  }

  analyzeBtn.disabled = true;
  analyzeBtn.innerHTML = '<span class="spinner"></span>Analyzing...';
  statusEl.textContent = 'This can take 20-60 seconds for long transcripts.';
  reportOutput.className = 'placeholder';
  reportOutput.textContent = 'Working on it...';
  copyBtn.style.display = 'none';

  try {
    const resp = await fetch('/analyze', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ transcript }),
    });
    const data = await resp.json();

    if (!resp.ok) {
      throw new Error(data.error || 'Something went wrong.');
    }

    lastReportText = data.report;
    reportOutput.className = '';
    reportOutput.innerHTML = marked.parse(data.report);
    copyBtn.style.display = 'inline-block';
    statusEl.textContent = 'Done.';
  } catch (err) {
    reportOutput.className = 'placeholder';
    reportOutput.textContent = 'Your report will appear here after analysis.';
    showError(err.message);
    statusEl.textContent = '';
  } finally {
    analyzeBtn.disabled = false;
    analyzeBtn.textContent = 'Analyze Transcript';
  }
});

copyBtn.addEventListener('click', async () => {
  await navigator.clipboard.writeText(lastReportText);
  copyBtn.textContent = 'Copied!';
  setTimeout(() => { copyBtn.textContent = 'Copy report as text'; }, 1500);
});
</script>

</body>
</html>
